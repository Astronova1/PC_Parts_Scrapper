services:
  # 2. .NET 8 Backend + Playwright Scraper Service
  backend:
    build:
      context: ./PC_Parts_Scrapper
      dockerfile: Dockerfile
    container_name: pcparts_backend
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DATABASE_URL=${DIRECT_URL}
      - FlareSolverr__BaseUrl=http://flaresolverr:8191/v1
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=https://findpcparts.app
      - JwtSettings__Audience=https://findpcparts.app
      - JwtSettings__ExpiryMinutes=60
      - Auth0__Audience=${AUTH0_AUDIENCE}
      - Auth0__Domain=${AUTH0_DOMAIN}
      - PredictionService__BaseUrl=http://prediction:8000
    ports:
      - "8080:8080"
    volumes:
      - playwright_profile:/app/playwright_profile
    depends_on:
      prediction:
        condition: service_started

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: always
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
    ports:
      - "8191:8191"

  # 3. Python Prophet Prediction Service
  prediction:
    build:
      context: ./Prediction_Service
      dockerfile: Dockerfile
    container_name: pcparts_prediction
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

  # 4. React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pcparts_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  playwright_profile: